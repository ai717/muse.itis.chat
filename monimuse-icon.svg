<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- 身体温润暖白渐变 -->
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#fef8ee"/>
      <stop offset="100%" stop-color="#fcefd7"/>
    </linearGradient>

    <!-- 萌萌小腮红 -->
    <radialGradient id="blushGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fb923c" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#fb923c" stop-opacity="0"/>
    </radialGradient>

    <!-- 灵感微光环 -->
    <linearGradient id="haloGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- 柔和阴影 -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#78350f" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- 柔和微底圈 -->
  <rect width="120" height="120" rx="32" fill="#fdfaf4"/>
  <rect width="118" height="118" x="1" y="1" rx="31" fill="none" stroke="#e8ded2" stroke-width="1.5"/>

  <!-- 灵感头顶小触角光环 (Muse Spark) -->
  <g transform="translate(60, 24)">
    <circle cx="0" cy="0" r="6.5" fill="url(#haloGrad)"/>
    <circle cx="0" cy="0" r="3" fill="#ffffff" opacity="0.9"/>
    <!-- 智慧光芒微弧 -->
    <path d="M-8,-2 Q0,-8 8,-2" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
    <line x1="0" y1="6.5" x2="0" y2="14" stroke="#d97706" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Monimuse 身体 (圆润可爱的软萌几何水滴/小精灵，带微倾斜生机) -->
  <path d="M30,58 C30,38 42,32 60,32 C78,32 90,38 90,58 C90,82 82,96 60,96 C38,96 30,82 30,58 Z" 
        fill="url(#bodyGrad)" 
        stroke="#e2d4c0" 
        stroke-width="1.5"
        filter="url(#softGlow)"/>

  <!-- 萌萌小耳朵 / 小侧翼 -->
  <path d="M30,52 C23,48 22,58 29,62 Z" fill="#fdedd6" stroke="#e2d4c0" stroke-width="1.2"/>
  <path d="M90,52 C97,48 98,58 91,62 Z" fill="#fdedd6" stroke="#e2d4c0" stroke-width="1.2"/>

  <!-- 好奇灵动的大眼睛 -->
  <!-- 左眼 -->
  <ellipse cx="49" cy="56" rx="4.5" ry="6" fill="#241c15"/>
  <circle cx="47.5" cy="53.5" r="1.8" fill="#ffffff"/>
  <circle cx="51" cy="58" r="0.8" fill="#ffffff"/>

  <!-- 右眼 -->
  <ellipse cx="71" cy="56" rx="4.5" ry="6" fill="#241c15"/>
  <circle cx="69.5" cy="53.5" r="1.8" fill="#ffffff"/>
  <circle cx="73" cy="58" r="0.8" fill="#ffffff"/>

  <!-- 温暖友善的小微笑 -->
  <path d="M56,66 Q60,70 64,66" fill="none" stroke="#3d2c1d" stroke-width="2" stroke-linecap="round"/>

  <!-- 两颊粉嫩小腮红 -->
  <circle cx="41" cy="63" r="5" fill="url(#blushGrad)"/>
  <circle cx="79" cy="63" r="5" fill="url(#blushGrad)"/>

  <!-- 胸前微光核心 (Muse Core) -->
  <g transform="translate(60, 78)">
    <path d="M0,-4 L2,-1 L5,0 L2,1 L0,4 L-2,1 L-5,0 L-2,-1 Z" fill="#f59e0b"/>
  </g>
</svg>
